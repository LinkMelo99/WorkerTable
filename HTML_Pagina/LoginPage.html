<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WorkTable</title>

    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.css">
    <link rel="stylesheet" href="StyleLoginPage/StyleLoginPage.css">
    <link rel="stylesheet" href="StyleLoginPage/StyleNewBox.css">
    <link rel="stylesheet" href="StyleLoginPage/StyleLogin.css">


</head>

<body>


    <div class="ladoEsq">
        <div class="logoNome">
            <h1>WorkTable</h1>
        </div>

        <div class="descricaoPagina">
            <h1 id="texto-digitado"></h1>
            <p id="paragrafo1"></p>
            <p id="paragrafo2"></p>
            <p id="paragrafo3"></p>
        </div>


        <div class="buttonLogin">
            <button type="button"  class='btnLogin'aria-expanded="false">LOGIN</button>
        </div>

        <dialog class="janelalOGIN">
            <h1>Tela login</h1>
            <form action="/login" method="post" class="login">

                <div class="email" hidden>
                    <label for="email">Email</label>
                    <input
                            id="email"
                            name="email"
                            type="email"
                            autocomplete="email"
                            required
                    >
                </div>

                <div class="senha" hidden>
                    <div class="senha-cabecalho">
                        <label for="senha">Senha</label>
                        <a href="#">Esqueceu a senha?</a>
                    </div>

                    <input
                            id="senha"
                            name="senha"
                            type="password"
                            autocomplete="current-password"
                            required
                    >
                </div>

                <button type="submit" hidden>Entrar</button>

                <button type="button" class="gsi-material-button" hidden>
                    <div class="gsi-material-button-state"></div>
                    <div class="gsi-material-button-content-wrapper">
                        <div class="gsi-material-button-icon">
                            <svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"
                                 style="display: block;"
                                 aria-hidden="true">
                                <path fill="#EA4335"
                                      d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"></path>
                                <path fill="#4285F4"
                                      d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"></path>
                                <path fill="#FBBC05"
                                      d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"></path>
                                <path fill="#34A853"
                                      d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"></path>
                                <path fill="none" d="M0 0h48v48H0z"></path>
                            </svg>
                        </div>
                        <span class="gsi-material-button-contents">Fazer login com o Google</span>
                    </div>
                </button>

            </form>
        </dialog>

    </div>

    <div class="ladoDir" id="ladoDir">
        <button type="button" class="setaVoltar" id="setaVoltar" aria-label="Mostrar painel">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 aria-hidden="true">
                <path d="M9 6l6 6-6 6"/>
            </svg>
        </button>

        <button type="button" class="btnAddBox" id="btnAdd" aria-label="Adicionar box">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="5"
                 aria-hidden="true">
                <path d="M12 5v14M5 12h14"/>
            </svg>
        </button>

        <div class="boxTable" id="boxTable">

            <!--Titulo da box-->
            <div class="tituloDaBox">
                <label class="tituloBox" for="tituloBox"> <input type="text" id="tituloBox" value="WorkTable"
                                                                 class="inputDoTituloDaBox"></label>
            </div>

            <div class="TituloTarefa">
                <label class="nomeTarefa" for="nomeTarefa"></label>
                <input type="text" id="nomeTarefa" value="Tarefa 1" class="inputNomeTarefa" required>

                <button type="button" class="buttonAdicionar"></button>
            </div>

            <button type="button" class="buttonRemoverBox">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="10" height="10">
                    <path d="M504.6 148.5C515.9 134.9 514.1 114.7 500.5 103.4C486.9 92.1 466.7 93.9 455.4 107.5L320 270L184.6 107.5C173.3 93.9 153.1 92.1 139.5 103.4C125.9 114.7 124.1 134.9 135.4 148.5L278.3 320L135.4 491.5C124.1 505.1 125.9 525.3 139.5 536.6C153.1 547.9 173.3 546.1 184.6 532.5L320 370L455.4 532.5C466.7 546.1 486.9 547.9 500.5 536.6C514.1 525.3 515.9 505.1 504.6 491.5L361.7 320L504.6 148.5z"/>
                </svg>
            </button>


            <ul class="listaDeTarefas"></ul>

        </div>

    </div>


<template id="modeloTarefa">
    <li id="tarefa">
        <div class="textoTopo">
            <span class="textoTitulo"></span>

            <div class="acoes">

                <button type="button" class="buttonParticipantes"
                        aria-expanded="false"
                >Part
                </button>

                <button type="button" class="buttonNotes"
                        aria-expanded="false">Descrição
                </button>

                <button type="button" class="buttonData"
                        aria-label="Definir datas" aria-expanded="false">📅
                </button>

                <button type="button" class="buttonRemover"
                        aria-label="Remover tarefa">❌
                </button>

                <button type="button" class="buttonConcluido"
                        aria-label="Botao De Conclusao" aria-expanded="false">✔️
                </button>

            </div>
        </div>

        <small class="textoHidden" hidden></small>
        <small class="descricaoHidden" hidden></small>

        <div class="datasInicioeFim" hidden>
            <label>Início <input type="text" class="dataInicio"></label>
            <label>Fim <input type="text" class="dataFim"></label>
        </div>

        <div class="descricaoNotes" hidden>
            <label>Descricao
                <input type="text" class="inputDescricao">
            </label>
        </div>

    </li>
</template>

<template id="createBox">
    <div class="newBoxTable">
        <div class="tituloNovaBox">
            <label class="boxNewNome">
                <input type="text" value="WorkTable" class="inputDoTituloNovaBox">
            </label>
        </div>

        <div class="TituloNovaBoxTarefa">
            <label class="nomeNovaBoxTarefa"></label>
            <input type="text" value="Nova Tarefa" class="inputNomeNovaBoxTarefa" required>
            <button type="button" class="buttonCreateBox"></button>
        </div>

        <div>
            <button type="button" class="buttonRemoverNewBox">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="10" height="10">
                    <path d="M504.6 148.5C515.9 134.9 514.1 114.7 500.5 103.4C486.9 92.1 466.7 93.9 455.4 107.5L320 270L184.6 107.5C173.3 93.9 153.1 92.1 139.5 103.4C125.9 114.7 124.1 134.9 135.4 148.5L278.3 320L135.4 491.5C124.1 505.1 125.9 525.3 139.5 536.6C153.1 547.9 173.3 546.1 184.6 532.5L320 370L455.4 532.5C466.7 546.1 486.9 547.9 500.5 536.6C514.1 525.3 515.9 505.1 504.6 491.5L361.7 320L504.6 148.5z"/>
                </svg>
            </button>
        </div>

        <ul class="newListaDeTarefasTemplate"></ul>
    </div>
</template>


<script src="Scripts/ScriptCriarTarefa.js"></script>

<script src="Scripts/ScripMoverNewBox.js"></script>
<script src="Scripts/ScriptBoxTable.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13"></script>
<script src="Scripts/ScriptCriarBox.js"></script>
<script src="Scripts/ScriptTextoBoasVindas.js"></script>
<script src="Scripts/ScriptLogin.js"></script>
</body>
</html>
